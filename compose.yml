# RepasTator (version web) sur le serveur, lancé par deployer-projet dans /srv/apps/repastator.
services:
  app:
    build: .
    # Nom utilisé par Caddy : reverse_proxy repastator:3000
    container_name: repastator
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: Europe/Paris
      DOSSIER_DONNEES: /data
    # Base SQLite (recettes, planning, courses) : à sauvegarder
    volumes:
      - /srv/data/repastator:/data
    # PAS de "ports:" : Caddy joint le conteneur par le réseau "web".
    networks:
      - web
    mem_limit: 256m

networks:
  web:
    external: true
